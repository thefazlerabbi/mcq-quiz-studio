name: Build MCQ Quiz Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint libltdl-dev libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            build-essential gcc g++ make ant lbzip2 \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.6.0" "cython<3.4"

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          yes | buildozer -v android debug

      - name: Show APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCQ-Quiz-Studio-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
